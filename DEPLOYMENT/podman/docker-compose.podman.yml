# Surcharge PODMAN ROOTLESS (LOT-4 v3.0.6, #267) des Compose PROD (racine actif/passif et enfant : meme service
# `secagent-server`) :
#   podman-compose -f ../prod/docker-compose.server.yml [-f ../prod/docker-compose.child.yml] -f docker-compose.podman.yml up -d
# Jamais utilisee sous Docker (la CI ne la charge pas : sans effet sur les rendus Docker).
#
# Mapping uid : `keep-id:uid=10001,gid=10001` => l'uid 10001 DU CONTENEUR (USER de l'image, `user: "10001:10001"`
# inchange) est l'uid 1000 (`cyril`) DE L'HOTE. Les fichiers crees par le serveur dans /data (STATE_DIR) et les secrets lus
# dans /run/secrets appartiennent donc a l'uid 1000 sur le partage MooseFS (PRIVATE/PROD/ monte par cyril, sans
# allow_other). read_only, cap_drop, tmpfs, healthcheck : inchanges (Compose de base).
# Exige Podman >= 4.3 (keep-id:uid=) et podman-compose >= 1.2 (transmet userns_mode) : controle par install-node.sh.
# Secrets : `SECRET_OWNER_UID=1000 ./preflight-secrets.sh` (et non 10001) avant `up`.
x-podman:
  host_uid: 1000                 # cyril sur srv1-srv4 = proprietaire des fichiers de PRIVATE/<ENV>/
  secret_owner_uid: 1000         # valeur de SECRET_OWNER_UID pour preflight-secrets.sh
  container_host: ssh://cyril@<ip>/run/user/1000/podman/podman.sock
  host_prefix: /home/cyril/secagent/prod   # SECAGENT_HOST_PREFIX : seuls binds autorises (check_no_binds.py --allow-prefix)

services:
  secagent-server:
    userns_mode: "keep-id:uid=10001,gid=10001"
