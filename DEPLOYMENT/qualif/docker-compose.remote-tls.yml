# Surcharge « hote Docker DISTANT » : les certificats ne sont plus un bind mount (resolu SUR l'hote distant, ou
# QUALIF_TLS_DIR n'existe pas) mais un VOLUME Docker nomme, alimente depuis le poste par
# `chain-test.sh push-tls` (conteneur ephemere, flux tar sur stdin : rien n'est copie ailleurs que dans le volume).
#   export DOCKER_HOST=tcp://192.168.1.218:2375 TLS_MODE=volume
#   docker compose -p secagent-qualif -f docker-compose.chain.yml -f docker-compose.remote-tls.yml ...
# (chain-test.sh ajoute ce fichier tout seul quand TLS_MODE=volume). Non utilise par la CI (bind mount local).
x-tls-volume: &tls-volume
  volumes:
    - type: volume
      source: secagent_tls
      target: /certs
      read_only: true

services:
  secagent-server-a: *tls-volume
  secagent-server-b: *tls-volume
  secagent-child: *tls-volume
  secagent-grandchild: *tls-volume   # profil level3
  # Minions : CA PUBLIQUE SEULE (T49 H1), volume `secagent_tls_ca` (ca.crt seul, push-tls) ; `!override` remplace la liste
  # (le bind du fichier ca.crt du Compose de base designerait un chemin du client). Jamais le volume TLS complet (tls.key).
  minion-root:
    volumes: !override
      - minion_root_data:/var/lib/secagent-minion
      - {type: volume, source: secagent_tls_ca, target: /certs, read_only: true}
  minion-child:
    volumes: !override
      - minion_child_data:/var/lib/secagent-minion
      - {type: volume, source: secagent_tls_ca, target: /certs, read_only: true}
  minion-grand:                      # profil level3
    volumes: !override
      - minion_grand_data:/var/lib/secagent-minion
      - {type: volume, source: secagent_tls_ca, target: /certs, read_only: true}

volumes:
  secagent_tls:
    external: true
    name: ${SECAGENT_TLS_VOLUME:-secagent-qualif_tls}
  secagent_tls_ca:
    external: true
    name: ${SECAGENT_TLS_CA_VOLUME:-secagent-qualif_tls_ca}
