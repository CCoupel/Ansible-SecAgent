# docker-compose.proxy.yml — Ansible-SecAgent Multi-Zone Proxy (Phase 12 / issue #120)
#
# Topologie simulée :
#   relay-proxy ──┬── relay-dmz1 (zone DMZ1)
#                                    └── relay-dmz2 (zone DMZ2)
#
# Réseaux :
#   proxy-net  : accès externe → relay-proxy uniquement
#   dmz1-net   : relay-proxy ↔ relay-dmz1 + agent-dmz1
#   dmz2-net   : relay-proxy ↔ relay-dmz2 + agent-dmz2
#   → relay-dmz1 et relay-dmz2 ne partagent aucun réseau commun (isolation totale)
#
# Déploiement :
#   cp .env.proxy .env
#   # Éditer .env (secrets + RELAY_ENROLLMENT_TOKEN)
#   DOCKER_HOST=tcp://192.168.1.218:2375 docker compose -f docker-compose.proxy.yml up --build -d
#
# Smoke test :
#   DOCKER_HOST=tcp://192.168.1.218:2375 bash smoke-proxy.sh
#
# Ports exposés sur l'hôte :
#   7780 → relay-proxy  API   (enrollment, /api/agents)
#   7781 → relay-proxy  Admin
#   7782 → relay-proxy  WS
#   7783 → relay-dmz1   API   (smoke test uniquement)
#   7784 → relay-dmz2   API   (smoke test uniquement)

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # relay-proxy — relay principal en mode proxy/gateway
  # Connecté aux 3 réseaux : peut joindre relay-dmz1 et relay-dmz2
  # ─────────────────────────────────────────────────────────────────────────────

  relay-proxy:
    build:
      context: ../../GO
      dockerfile: Dockerfile
    image: secagent-server:latest
    container_name: relay-proxy
    user: "0:0"    # root pour qualif — volume /data owned by root
    restart: unless-stopped
    environment:
      DATABASE_URL: "/data/relay-proxy.db"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      LOG_LEVEL: "INFO"
    volumes:
      - relay_proxy_data:/data
    ports:
      - "7780:7770"   # API (enrollment + /api/agents agrégés)
      - "7781:7771"   # Admin
      - "7782:7772"   # WebSocket agents
    networks:
      - proxy-net
      - dmz1-net
      - dmz2-net
    healthcheck:
      test: ["CMD", "/app/secagent-server", "status", "--local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────────────────────────────────────────
  # relay-dmz1 — relay standalone zone DMZ1
  # Uniquement sur dmz1-net : joignable par relay-proxy, invisible depuis dmz2-net
  # ─────────────────────────────────────────────────────────────────────────────

  relay-dmz1:
    build:
      context: ../../GO
      dockerfile: Dockerfile
    image: secagent-server:latest
    container_name: relay-dmz1
    user: "0:0"    # root pour qualif — volume /data owned by root
    restart: unless-stopped
    environment:
      DATABASE_URL: "/data/relay-dmz1.db"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      LOG_LEVEL: "INFO"
    volumes:
      - relay_dmz1_data:/data
    ports:
      - "7783:7770"   # API DMZ1 (exposé pour smoke test uniquement)
    networks:
      - dmz1-net
    healthcheck:
      test: ["CMD", "/app/secagent-server", "status", "--local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────────────────────────────────────────
  # relay-dmz2 — relay standalone zone DMZ2
  # Uniquement sur dmz2-net : joignable par relay-proxy, invisible depuis dmz1-net
  # ─────────────────────────────────────────────────────────────────────────────

  relay-dmz2:
    build:
      context: ../../GO
      dockerfile: Dockerfile
    image: secagent-server:latest
    container_name: relay-dmz2
    user: "0:0"    # root pour qualif — volume /data owned by root
    restart: unless-stopped
    environment:
      DATABASE_URL: "/data/relay-dmz2.db"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      LOG_LEVEL: "INFO"
    volumes:
      - relay_dmz2_data:/data
    ports:
      - "7784:7770"   # API DMZ2 (exposé pour smoke test uniquement)
    networks:
      - dmz2-net
    healthcheck:
      test: ["CMD", "/app/secagent-server", "status", "--local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────────────────────────────────────────
  # Agents de test — un par zone DMZ
  # Se connectent uniquement au relay de leur zone (isolation réseau garantie)
  # ─────────────────────────────────────────────────────────────────────────────

  agent-dmz1:
    build:
      context: ../../GO
      dockerfile: Dockerfile.agent
    image: secagent-minion:latest
    container_name: agent-dmz1
    restart: unless-stopped
    depends_on:
      relay-dmz1:
        condition: service_healthy
    environment:
      RELAY_SERVER_URL: "http://relay-dmz1:7770"
      RELAY_WS_URL: "ws://relay-dmz1:7772/ws/agent"
      RELAY_AGENT_HOSTNAME: "dmz1-host-01"
      RELAY_PRIVATE_KEY: "/var/lib/secagent-minion/id_rsa"
      RELAY_JWT_PATH: "/var/lib/secagent-minion/token.jwt"
      RELAY_ENROLLMENT_TOKEN: "${RELAY_ENROLLMENT_TOKEN_DMZ1}"
      RELAY_ASYNC_DIR: "/var/lib/secagent-minion/async"
      RELAY_INSECURE_TLS: "true"
      MAX_CONCURRENT_TASKS: "5"
    volumes:
      - agent_dmz1_data:/var/lib/secagent-minion
    networks:
      - dmz1-net   # Accès relay-dmz1 uniquement — ne voit PAS relay-dmz2

  agent-dmz2:
    build:
      context: ../../GO
      dockerfile: Dockerfile.agent
    image: secagent-minion:latest
    container_name: agent-dmz2
    restart: unless-stopped
    depends_on:
      relay-dmz2:
        condition: service_healthy
    environment:
      RELAY_SERVER_URL: "http://relay-dmz2:7770"
      RELAY_WS_URL: "ws://relay-dmz2:7772/ws/agent"
      RELAY_AGENT_HOSTNAME: "dmz2-host-01"
      RELAY_PRIVATE_KEY: "/var/lib/secagent-minion/id_rsa"
      RELAY_JWT_PATH: "/var/lib/secagent-minion/token.jwt"
      RELAY_ENROLLMENT_TOKEN: "${RELAY_ENROLLMENT_TOKEN_DMZ2}"
      RELAY_ASYNC_DIR: "/var/lib/secagent-minion/async"
      RELAY_INSECURE_TLS: "true"
      MAX_CONCURRENT_TASKS: "5"
    volumes:
      - agent_dmz2_data:/var/lib/secagent-minion
    networks:
      - dmz2-net   # Accès relay-dmz2 uniquement — ne voit PAS relay-dmz1

# ─────────────────────────────────────────────────────────────────────────────
# Réseaux — isolation par zone
# relay-proxy est le seul nœud présent dans les 3 réseaux
# ─────────────────────────────────────────────────────────────────────────────

networks:
  proxy-net:
    driver: bridge
    name: qualif-proxy-net
  dmz1-net:
    driver: bridge
    name: qualif-dmz1-net
  dmz2-net:
    driver: bridge
    name: qualif-dmz2-net

volumes:
  relay_proxy_data:
  relay_dmz1_data:
  relay_dmz2_data:
  agent_dmz1_data:
  agent_dmz2_data:
