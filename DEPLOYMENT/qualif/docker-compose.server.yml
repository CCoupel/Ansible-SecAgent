# secagent-server — QUALIF (192.168.1.218) : remplace l'ancien Compose Python.
#
# Topologie ACTIF/PASSIF : 2 instances (a, b) sur UN MEME volume d'etat partage `secagent_state`
# (support de l'E2E #171 et du test de basculement). Exactement 1 maitre (ports ouverts), 1 secondaire
# (aucun port). Un seul service dans la prod ; ici deux pour reproduire plusieurs hotes sur un seul.
#
# PUBLISH QUALIF = promotion SANS rebuild : SECAGENT_IMAGE reference l'image candidate publiee par la CI
# sur milestone/** (ghcr.io/ccoupel/secagent-server:sha-<commit>@sha256:<digest>).
#
#   export SECAGENT_IMAGE=ghcr.io/ccoupel/secagent-server:sha-<commit>@sha256:<digest>
#   cp qualif.env.example qualif.env   # secrets de QUALIF (jamais ceux de PROD), hors depot
#   DOCKER_HOST=tcp://192.168.1.218:2375 docker compose -p secagent-qualif \
#       -f docker-compose.server.yml up -d
#
# Pas de bus ni de reverse proxy : TLS natif (TLS_CERT/TLS_KEY dans QUALIF_TLS_DIR). TLS_DISABLE n'est pas utilise.

x-secagent: &secagent
  image: ${SECAGENT_IMAGE:?SECAGENT_IMAGE est obligatoire (image candidate sha-<commit>@sha256:<digest>)}
  restart: unless-stopped
  user: "10001:10001"
  stop_grace_period: 30s
  read_only: true
  mem_limit: ${SECAGENT_MEM_LIMIT:-2g}
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  env_file:
    - path: ./qualif.env
      required: true
  volumes:
    - secagent_state:/data
    - type: bind
      source: ${QUALIF_TLS_DIR:?QUALIF_TLS_DIR est obligatoire (tls.crt / tls.key)}
      target: /certs
      read_only: true
  tmpfs:
    - /run/secagent:uid=10001,gid=10001,mode=0700
    - /tmp:uid=10001,gid=10001,mode=1777
  healthcheck:
    test: ["CMD", "/app/secagent-server", "status", "--local"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 20s

x-secagent-env: &secagent-env
  STATE_DIR: /data
  API_ADDR: "0.0.0.0:7770"
  WS_ADDR: "0.0.0.0:7772"
  ADMIN_ADDR: "0.0.0.0:7771"
  ADMIN_TLS: "true"
  TLS_CERT: /certs/tls.crt
  TLS_KEY: /certs/tls.key
  LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
  GOMEMLIMIT: ${GOMEMLIMIT:-1638MiB}   # ~80 % de SECAGENT_MEM_LIMIT

services:
  secagent-server-a:
    <<: *secagent
    container_name: secagent-qualif-a
    environment: *secagent-env
    ports:
      - "7770:7770"
      - "7772:7772"
      - "127.0.0.1:7771:7771"

  # Meme image, meme volume d'etat : deuxieme "hote". Ports d'hote decales (une seule machine) ; dans le
  # conteneur ce sont les memes 7770/7771/7772. Le secondaire n'ouvre aucun port dans son conteneur.
  secagent-server-b:
    <<: *secagent
    container_name: secagent-qualif-b
    environment: *secagent-env
    ports:
      - "8770:7770"
      - "8772:7772"
      - "127.0.0.1:8771:7771"

volumes:
  # Volume local partage par les 2 conteneurs (meme hote). Pour tester un vrai partage reseau (NFS),
  # remplacer par un volume `driver_opts type=nfs` : voir DEPLOYMENT/prod/README.md.
  secagent_state:
