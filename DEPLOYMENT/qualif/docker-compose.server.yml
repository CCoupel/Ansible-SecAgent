# secagent-server — QUALIF (192.168.1.218) : remplace l'ancien Compose Python.
#
# Topologie ACTIF/PASSIF : 2 instances (a, b) sur UN MEME volume d'etat partage `secagent_state`
# (support de l'E2E #171 et du test de basculement). Exactement 1 maitre (ports ouverts), 1 secondaire
# (aucun port). Un seul service dans la prod ; ici deux pour reproduire plusieurs hotes sur un seul.
#
# PUBLISH QUALIF = promotion SANS rebuild : SECAGENT_IMAGE reference l'image candidate publiee par la CI
# sur milestone/** (ghcr.io/ccoupel/secagent-server:sha-<commit>@sha256:<digest>).
#
#   export SECAGENT_IMAGE=ghcr.io/ccoupel/secagent-server:sha-<commit>@sha256:<digest>
#   bash failover-test.sh setup-ci     # ou, en qualif : deposer SES secrets (secrets/jwt_secret_key, admin_token,
#                                      # rsa_master_key) puis `push_secrets` : volume ${PROJECT}_secrets (jamais ceux de PROD)
#   DOCKER_HOST=tcp://192.168.1.218:2375 docker compose -p secagent-qualif \
#       -f docker-compose.server.yml up -d
#
# Pas de bus ni de reverse proxy : TLS natif (TLS_CERT/TLS_KEY dans QUALIF_TLS_DIR). TLS_DISABLE n'est pas utilise.

x-secagent: &secagent
  image: ${SECAGENT_IMAGE:?SECAGENT_IMAGE est obligatoire (image candidate sha-<commit>@sha256:<digest>)}
  # `never` pour des images chargees localement (docker load d'un artefact CI) ; `missing` (defaut) pour un registre.
  pull_policy: ${SECAGENT_PULL_POLICY:-missing}
  restart: unless-stopped
  user: "10001:10001"
  stop_grace_period: 30s
  read_only: true
  mem_limit: ${SECAGENT_MEM_LIMIT:-2g}
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  # Secrets (#197 item 6, v3.0.5) : FICHIERS lus via *_FILE, plus aucune variable d'environnement (invisibles dans
  # `docker inspect`). Volume EXTERNE (modele des volumes tls / hooks / link : un `secrets: file:` serait un bind mount du
  # CLIENT, irrealisable contre un demon distant) alimente par `push_secrets` (proprietaire 10001, mode 0400).
  volumes:
    - secagent_state:/data
    - type: volume
      source: secagent_secrets
      target: /run/secagent-secrets
      read_only: true
    - type: bind
      source: ${QUALIF_TLS_DIR:?QUALIF_TLS_DIR est obligatoire (tls.crt / tls.key)}
      target: /certs
      read_only: true
  tmpfs:
    - /run/secagent:uid=10001,gid=10001,mode=0700
    - /tmp:uid=10001,gid=10001,mode=1777
  healthcheck:
    test: ["CMD", "/app/secagent-server", "status", "--local"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 20s

x-secagent-env: &secagent-env
  JWT_SECRET_KEY_FILE: /run/secagent-secrets/jwt_secret_key
  ADMIN_TOKEN_FILE: /run/secagent-secrets/admin_token
  RSA_MASTER_KEY_FILE: /run/secagent-secrets/rsa_master_key
  STATE_DIR: /data
  RELAY_STATUS_FILE: /run/secagent/status.json
  API_ADDR: "0.0.0.0:7770"
  WS_ADDR: "0.0.0.0:7772"
  ADMIN_ADDR: "0.0.0.0:7771"
  ADMIN_TLS: "true"
  TLS_CERT: /certs/tls.crt
  TLS_KEY: /certs/tls.key
  LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
  GOMEMLIMIT: ${GOMEMLIMIT:-1638MiB}   # ~80 % de SECAGENT_MEM_LIMIT
  # relay.converged (#246, LOT-3.2) : delai de convergence apres une promotion, raccourci en qualif (defaut serveur 60 s)
  RELAY_CONVERGENCE_TIMEOUT: 30s

services:
  secagent-server-a:
    <<: *secagent
    container_name: secagent-qualif-a
    environment: *secagent-env
    ports:
      - "7770:7770"
      - "7772:7772"
      - "127.0.0.1:7771:7771"

  # Meme image, meme volume d'etat : deuxieme "hote". Ports d'hote decales (une seule machine) ; dans le
  # conteneur ce sont les memes 7770/7771/7772. Le secondaire n'ouvre aucun port dans son conteneur.
  secagent-server-b:
    <<: *secagent
    container_name: secagent-qualif-b
    environment: *secagent-env
    ports:
      - "8770:7770"
      - "8772:7772"
      - "127.0.0.1:8771:7771"

volumes:
  # Volume local partage par les 2 conteneurs (meme hote). Pour tester un vrai partage reseau (NFS),
  # remplacer par un volume `driver_opts type=nfs` : voir DEPLOYMENT/prod/README.md.
  secagent_state: {}
  # Volume EXTERNE des secrets serveur (cree et alimente par `failover-test.sh setup-ci` / `chain-test.sh bootstrap`) :
  # JWT_SECRET_KEY, ADMIN_TOKEN, RSA_MASTER_KEY en fichiers 0400 (10001). Retire par `down` / `teardown`.
  secagent_secrets:
    external: true
    name: ${SECAGENT_SECRETS_VOLUME:-secagent-qualif_secrets}
