# secagent-server — PRODUCTION, relay RACINE (un Compose par relay, identique sur N hotes).
#
# Actif/passif : les N hotes lancent CE MEME fichier avec le MEME STATE_DIR (stockage partage). Une
# instance prend relay.lock et devient maitre (ports 7770/7772 ouverts) ; les autres sont secondaires
# et n'ouvrent AUCUN port. `restart: unless-stopped` : un maitre qui perd le verrou sort et repart
# comme secondaire.
#
# Usage : cp .env.example .env ; cp prod.env.example prod.env  (tous deux HORS DEPOT, jamais commites)
#         docker compose -p secagent-prod-<relay_id> -f docker-compose.server.yml up -d
# Pour un relay ENFANT : ajouter -f docker-compose.child.yml (REPEATER_* obligatoires).
#
# Dans la release, la ligne `image:` est reecrite en `...:vX.Y.Z@sha256:<digest>` (jamais `latest`,
# jamais de construction locale). Kubernetes/Helm et Swarm : hors perimetre. Pas de bus de messages ni de reverse proxy : TLS natif.

name: secagent

services:
  secagent-server:
    image: ghcr.io/ccoupel/secagent-server:${SECAGENT_VERSION:?SECAGENT_VERSION est obligatoire (ex. v3.0.3)}
    restart: unless-stopped
    # UID/GID de l'image : IDENTIQUES sur tous les hotes (droits du partage portes par l'UID numerique).
    user: "10001:10001"
    stop_grace_period: 30s        # arret propre : relache relay.lock pour une bascule rapide
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Secrets : JWT_SECRET_KEY, ADMIN_TOKEN, RSA_MASTER_KEY (IDENTIQUES sur tous les noeuds candidats).
    env_file:
      - path: ./prod.env
        required: true
    environment:
      STATE_DIR: /data
      # Fichier de statut LOCAL de `status --local` : tmpfs ci-dessous, JAMAIS dans STATE_DIR (refuse sinon).
      RELAY_STATUS_FILE: /run/secagent/status.json
      API_ADDR: "0.0.0.0:7770"
      WS_ADDR: "0.0.0.0:7772"
      # Admin : lie sur toutes les interfaces DU CONTENEUR (le port est publie plus bas UNIQUEMENT sur
      # la boucle locale / le reseau d'admin de l'hote). Une adresse non loopback impose ADMIN_TLS=true
      # (recommande, retenu ici) ou la derogation ADMIN_INSECURE_HTTP + ADMIN_INSECURE_HTTP_ACK.
      ADMIN_ADDR: "0.0.0.0:7771"
      ADMIN_TLS: "true"
      # TLS natif (7770, 7771, 7772). TLS_DISABLE est INTERDIT en production (ne jamais le definir).
      TLS_CERT: /certs/tls.crt
      TLS_KEY: /certs/tls.key
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Le GC travaille avant l'OOM-kill : ~80 % de la limite memoire (2 GiB -> 1638 MiB). A changer
      # AVEC SECAGENT_MEM_LIMIT (voir « Dimensionnement » dans le README).
      GOMEMLIMIT: ${GOMEMLIMIT:-1638MiB}
    volumes:
      # Etat partage (relay.state, relay.lock, journal). Voir DEPLOYMENT/prod/README.md : montage
      # NFS de l'hote (fstab : hard, noatime...) puis bind mount ; alternative : volume Docker NFS
      # (bloc `volumes:` ci-dessous). Stockage NON TESTE (tools/test_shared_storage.py) = NON SUPPORTE.
      - type: bind
        source: ${STATE_HOST_DIR:?STATE_HOST_DIR est obligatoire (point de montage du partage)}
        target: /data
      - type: bind
        source: ${TLS_CERT_DIR:?TLS_CERT_DIR est obligatoire (repertoire tls.crt / tls.key)}
        target: /certs
        read_only: true
    # Fichier de statut de `status --local` : LOCAL au conteneur, jamais sur le partage.
    tmpfs:
      - /run/secagent:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=1777
    ports:
      - "7770:7770"      # API
      - "7772:7772"      # WebSocket agents
      # Admin : JAMAIS sans adresse d'hote (publierait sur toutes les interfaces). Boucle locale par
      # defaut ; ADMIN_PUBLISH_ADDR = adresse du reseau d'administration si besoin. Controle CI :
      # scripts/ci/check_compose.py.
      - "${ADMIN_PUBLISH_ADDR:-127.0.0.1}:7771:7771"
    healthcheck:
      # Un secondaire (aucun port ouvert) est `healthy` ; un process fige passe `unhealthy`.
      test: ["CMD", "/app/secagent-server", "status", "--local"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
    deploy:
      resources:
        limits: {cpus: "2", memory: "${SECAGENT_MEM_LIMIT:-2g}"}   # > 3000 hotes : 2 GiB minimum (pic ~900 Mio mesure a 10 000 agents)
        reservations: {cpus: "0.25", memory: 256m}

# Alternative au bind mount : volume Docker NFS (remplacer la ligne `type: bind` de /data par
# `- secagent_state:/data` et decommenter).
# volumes:
#   secagent_state:
#     driver: local
#     driver_opts:
#       type: nfs
#       o: "addr=${STATE_NFS_ADDR},nfsvers=4.1,hard,noatime,actimeo=1,rw"
#       device: ":${STATE_NFS_PATH}"
