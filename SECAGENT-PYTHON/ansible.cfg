[defaults]
# Plugins Ansible pour Ansible-SecAgent
inventory_plugins = ./ansible_plugins/inventory_plugins
connection_plugins = ./ansible_plugins/connection_plugins

# Inventory dynamique via secagent-inventory binary (GO)
inventory = /usr/local/bin/secagent-inventory

# Pour les tests locaux, désactiver la vérification d'hôte
host_key_checking = False

# Variables d'authentification relay (section lue par le connection plugin)
[secagent_connection]
# Fichier du jeton plugin : propriétaire = utilisateur Ansible, mode 0600, pas un lien symbolique
# (le plugin refuse sinon). Jamais sous /tmp. Surcharge possible : RELAY_TOKEN_FILE.
token_file = /etc/ansible/secagent_plugin.jwt
server = http://relay-api:7770
ca_bundle =
