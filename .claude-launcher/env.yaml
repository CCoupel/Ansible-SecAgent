# Exécution du projet en conteneur (Claude-Launcher-NG2) — versionné avec le projet
# Ajouts propres au projet ; env-template.yaml (s'il existe) vient du template : ne pas le modifier.
image: docker.io/library/ubuntu:26.04
# packages : paquets en plus (tmux, git, bash, sudo, curl : implicites)
# gcc + en-têtes libc : CGO, nécessaire à `go test -race` en local (2026-11-09, outillage_go.md)
packages: [gcc]
packages_by_manager:        # noms propres à une distribution
  # openssh-client (ssh, ssh-keygen, ssh-keyscan) : accès CONTAINER_HOST=ssh:// aux nœuds Podman srv1-srv4 (LOT-4 v3.0.6, #267)
  apt: [libc6-dev, openssh-client]
  dnf: [glibc-devel, openssh-clients]
  apk: [musl-dev, openssh-client]
setup:                      # étapes exécutées une fois, en utilisateur, dans le projet
  # Go 1.27.4 (GO-2026-6859, net/http ; = GO/go.work) : env-template.yaml installe encore la 1.27.3 tant que le template
  # n'est pas resynchronisé (/init-project lit go.work) ; cette étape, jouée APRÈS celle du template, relève ~/.local/go.
  # Archive officielle go.dev, SHA256 publié vérifié ; idempotente (rien si déjà en 1.27.4). À retirer après la resync.
  - |
    V=1.27.4; A=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
    case $A in amd64) H=7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840 ;; *) H= ;; esac
    if [ "$(~/.local/go/bin/go env GOVERSION 2>/dev/null)" != "go$V" ]; then
      [ -n "$H" ] || { echo "Go $V : somme SHA256 non declaree pour $A (env.yaml)" >&2; exit 1; }
      f=$(mktemp); curl -fsSLo "$f" "https://go.dev/dl/go$V.linux-$A.tar.gz"
      if ! echo "$H  $f" | sha256sum -c -; then rm -f "$f"; echo "Go $V : SHA256 de l'archive incorrect" >&2; exit 1; fi
      rm -rf ~/.local/go; mkdir -p ~/.local/bin; tar -xzf "$f" -C ~/.local; rm -f "$f"
      ln -sf ~/.local/go/bin/go ~/.local/go/bin/gofmt ~/.local/bin/
    fi
    # Palliatif (2026-11-12) : le `go mod download` du template tourne AVANT cette etape, avec la 1.27.3 qu'il vient de
    # reinstaller ; go.work exigeant 1.27.4 et GOTOOLCHAIN valant auto, Go telecharge d'office la toolchain 1.27.4 dans
    # ~/go (~250 Mo). Le launcher ne permet pas de surcharger l'etape du template (outillage_go.md) : on retire ici CETTE
    # toolchain seulement (repertoire du module, en lecture seule, et ses fichiers du cache) ; rien d'autre. Idempotent.
    M=$(go env GOMODCACHE 2>/dev/null || echo "$HOME/go/pkg/mod")
    for d in "$M"/golang.org/toolchain@v0.0.1-go1.27.*; do
      [ -e "$d" ] || continue
      chmod -R u+w "$d" && rm -rf "$d"
    done
    rm -f "$M"/cache/download/golang.org/toolchain/@v/v0.0.1-go1.27.*
  # identité git du poste : sans elle, git prend « Ubuntu <ubuntu@…> », non lié à GitHub → CLA rouge (#264, 2026-11-09)
  - git config --global user.name ccoupel
  - git config --global user.email cyril@coupel.net
# mounts: []                # dossiers en plus, ex. [{ path: ../autre, ro: true }]
