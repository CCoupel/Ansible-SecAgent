# Exécution du projet en conteneur (Claude-Launcher-NG2) — versionné avec le projet
# Ajouts propres au projet ; env-template.yaml (s'il existe) vient du template : ne pas le modifier.
image: docker.io/library/ubuntu:26.04
# packages : paquets en plus (tmux, git, bash, sudo, curl : implicites)
# gcc + en-têtes libc : CGO, nécessaire à `go test -race` en local (2026-11-09, outillage_go.md)
packages: [gcc]
packages_by_manager:        # noms propres à une distribution
  apt: [libc6-dev]
  dnf: [glibc-devel]
  apk: [musl-dev]
# setup: []                 # étapes exécutées une fois, en utilisateur, dans le projet
# mounts: []                # dossiers en plus, ex. [{ path: ../autre, ro: true }]
