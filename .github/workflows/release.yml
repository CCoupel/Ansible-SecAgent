name: Release

# Declenche par le tag officiel vX.Y.Z (rebuild deterministe depuis le commit fige du tag),
# ou a la demande sur un TAG EXISTANT (publication a posteriori des images).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existant a publier (ex. v2.0.0)'
        required: true
        type: string
      skip_tests:
        description: 'Ne pas rejouer les tests (version deja qualifiee uniquement ; ignore sur push de tag)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/ccoupel

jobs:
  prepare:
    name: Resoudre et valider le tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      is_latest: ${{ steps.resolve.outputs.is_latest }}
      run_tests: ${{ steps.resolve.outputs.run_tests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resoudre le tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_SKIP_TESTS: ${{ github.event.inputs.skip_tests }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            RUN_TESTS=true
            [ "$INPUT_SKIP_TESTS" = "true" ] && RUN_TESTS=false
          else
            TAG="$PUSH_TAG"
            RUN_TESTS=true
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag invalide '$TAG' (attendu vX.Y.Z)"; exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "::error::Le tag '$TAG' n'existe pas dans le depot"; exit 1
          fi
          # 'latest' uniquement si ce tag est la plus haute version SemVer du depot
          HIGHEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | sed -n 1p)
          IS_LATEST=false
          [ "$HIGHEST" = "$TAG" ] && IS_LATEST=true
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "is_latest=$IS_LATEST"
            echo "run_tests=$RUN_TESTS"
          } >> "$GITHUB_OUTPUT"
          if [ "$RUN_TESTS" = "false" ]; then
            echo "::warning::Tests desactives (skip_tests) pour $TAG"
          fi

  test:
    name: Build + tests Go
    needs: prepare
    if: needs.prepare.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: GO/go.work
          cache-dependency-path: GO/go.sum

      - name: Build
        working-directory: GO
        run: go build ./...

      # Bloquant, sans contournement.
      - name: Tests
        working-directory: GO
        env:
          JWT_SECRET_KEY: test
          ADMIN_TOKEN: test
        run: go test ./... -timeout 120s

  # Prerequis BLOQUANT de la publication (#174 M6) : le basculement actif/passif est verifie avec l'image
  # construite localement depuis le commit du tag (arret propre puis docker kill, vraies peremptions).
  failover:
    name: Basculement en conteneurs (stop + kill)
    needs: [prepare, test]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECAGENT_IMAGE: secagent-server:ci
      QUALIF_TLS_DIR: ${{ github.workspace }}/DEPLOYMENT/qualif/.ci-tls
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
      - name: Build de l'image du tag (local, sans push)
        run: docker build -t secagent-server:ci -f GO/Dockerfile GO
      - name: Preparation
        run: bash DEPLOYMENT/qualif/failover-test.sh setup-ci
      - name: Arret propre
        run: bash DEPLOYMENT/qualif/failover-test.sh run stop
      - name: docker kill
        run: bash DEPLOYMENT/qualif/failover-test.sh run kill
      - name: Nettoyage
        if: always()
        run: bash DEPLOYMENT/qualif/failover-test.sh teardown || true

  images:
    name: Image GHCR ${{ matrix.image }}
    needs: [prepare, test, failover]
    # test peut etre 'skipped' (skip_tests) mais jamais 'failure'
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') && needs.failover.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: secagent-server
            dockerfile: Dockerfile
          - image: secagent-minion
            dockerfile: Dockerfile.agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadonnees image
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_latest == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      # Date du commit du tag : horodatages reproductibles (rewrite-timestamp) pour un rebuild deterministe.
      - name: SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build et push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        with:
          context: GO
          file: GO/${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push=true,rewrite-timestamp=true
          # M10 : SBOM et attestation de provenance attaches aux images (signature cosign : a proposer)
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # M2 : le digest est transmis au job release (les sorties de matrice s'ecrasent : artefact par image).
      - name: Exporter le digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          case "$DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "::error::Digest invalide '$DIGEST'"; exit 1;; esac
          mkdir -p digests && printf '%s' "$DIGEST" > "digests/${{ matrix.image }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}
          if-no-files-found: error

  # Controle de reproductibilite (M1) : deux builds locaux (sans attestation, qui contiennent des dates)
  # du meme commit doivent donner le meme digest. Avertissement au premier passage ; a passer en
  # erreur une fois la reproductibilite obtenue (retirer `continue-on-error` et le ::warning::).
  reproducibility:
    name: Reproductibilite ${{ matrix.image }}
    needs: [prepare, test]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: secagent-server, dockerfile: Dockerfile}
          - {image: secagent-minion, dockerfile: Dockerfile.agent}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Deux builds, comparaison des digests
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          for n in 1 2; do
            docker buildx build --provenance=false --sbom=false --no-cache \
              --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
              -f GO/${{ matrix.dockerfile }} \
              --output "type=oci,dest=build$n.tar,rewrite-timestamp=true" GO
            mkdir "o$n" && tar -xf "build$n.tar" -C "o$n"
            python3 -c "import json;print(json.load(open('o$n/index.json'))['manifests'][0]['digest'])" > "d$n"
          done
          echo "build1=$(cat d1) build2=$(cat d2)"
          if ! cmp -s d1 d2; then
            echo "::warning::${{ matrix.image }} : builds non reproductibles ($(cat d1) != $(cat d2)). Cause probable : couche runtime (apk) ou metadonnees ; a documenter puis passer en erreur."
          fi

  release:
    name: Release GitHub
    needs: [prepare, test, images]
    if: ${{ !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      # Ne jamais recreer ni ecraser une release existante.
      - name: Release deja existante ?
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG deja publiee : rien a faire (images seules publiees)."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.exists.outputs.exists == 'false'
        with:
          go-version-file: GO/go.work
          cache-dependency-path: GO/go.sum

      - name: Notes depuis CHANGELOG.md
        if: steps.exists.outputs.exists == 'false'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          awk -v tag="$TAG" '
            /^## \[/ { if (found) exit; if (index($0, "[" tag "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::Aucune entree '## [$TAG]' dans CHANGELOG.md"; exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.exists.outputs.exists == 'false'
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      # M3 : Compose de production publies AVEC la release, images reecrites en tag@digest.
      - name: Archive Compose (secagent-compose)
        if: steps.exists.outputs.exists == 'false'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/ci/build_compose_archive.sh "$TAG" "$VERSION" "$(cat digests/secagent-server)" dist

      - name: Binaires linux/amd64 + sommes de controle
        if: steps.exists.outputs.exists == 'false'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cd GO
          # server : pur Go, sans CGO (l'état du relay est un fichier, plus de SQLite : #160), comme GO/Dockerfile
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w" -o "../dist/secagent-server-${VERSION}-linux-amd64" ./cmd/secagent-server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w" -o "../dist/secagent-minion-${VERSION}-linux-amd64" ./cmd/secagent-minion
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w" -o "../dist/secagent-inventory-${VERSION}-linux-amd64" ./cmd/secagent-inventory
          cd ../dist
          sha256sum ./* > "SHA256SUMS-${VERSION}.txt"

      - name: Creer la release
        if: steps.exists.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file release-notes.md
