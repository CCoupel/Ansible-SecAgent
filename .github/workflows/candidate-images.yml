name: Candidate images (QUALIF promotion)

# MANUEL UNIQUEMENT. Un push ou une PR ne publient jamais rien : la publication sur GHCR est reservee
# a ce declenchement explicite (promotion QUALIF) et au tag vX.Y.Z (release.yml, PROD).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branche ou commit a construire (defaut : le ref du dispatch)'
        required: false
        type: string
      publish:
        description: 'Confirmer la publication sur ghcr.io (doit etre true)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: candidate-images-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  candidate-images:
    name: Image candidate ${{ matrix.image }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: secagent-server, dockerfile: Dockerfile}
          - {image: secagent-minion, dockerfile: Dockerfile.agent}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Commit construit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: GO
          file: GO/${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/ccoupel/${{ matrix.image }}:sha-${{ steps.commit.outputs.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Reference de promotion QUALIF
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          echo "ghcr.io/ccoupel/${{ matrix.image }}:sha-${SHA}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
