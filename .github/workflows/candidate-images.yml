name: Candidate images (QUALIF promotion)

# MANUEL UNIQUEMENT. Un push ou une PR ne publient jamais rien : la publication sur GHCR est reservee
# a ce declenchement explicite (promotion QUALIF) et au tag vX.Y.Z (release.yml, PROD).
#
# Ce fichier est present sur la branche par defaut (main) UNIQUEMENT pour que GitHub expose
# `workflow_dispatch` ; le code construit est celui du `ref` fourni (defaut main), jamais
# celui de main. Exception volontaire a scripts/ci/check_no_publish.py (qui ne s'applique qu'a ci.yml,
# le workflow de push/PR) : ce workflow publie, mais seulement sur dispatch manuel avec publish=true.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branche ou commit a construire'
        required: false
        type: string
        default: 'main'
      publish:
        description: 'Confirmer la publication sur ghcr.io (doit etre true)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: candidate-images-${{ inputs.ref || 'main' }}
  cancel-in-progress: false

jobs:
  candidate-images:
    name: Image candidate ${{ matrix.image }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write       # #213 : jeton OIDC pour signer l'attestation de provenance (Sigstore)
      attestations: write   # #213 : enregistrement de l'attestation par GitHub
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: secagent-server, dockerfile: Dockerfile}
          - {image: secagent-minion, dockerfile: Dockerfile.agent}
    steps:
      # Validation AVANT tout checkout : jamais le code d'une pull request (y compris d'un fork).
      - name: Valider le ref demande
        env:
          REF: ${{ inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/pull/* || "$REF" == pull/* ]]; then
            echo "::error::Un ref de pull request est refuse (${REF}) : seuls une branche ou un commit du depot sont acceptes."; exit 1
          fi
          if ! [[ "$REF" =~ ^[A-Za-z0-9._/-]{1,200}$ ]]; then
            echo "::error::Ref invalide (caracteres autorises : lettres, chiffres, . _ / -)."; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false   # depot public : le `git fetch origin` ci-dessous est anonyme (B32)

      # Le commit construit doit appartenir a une BRANCHE du depot (un commit n'existant que dans une PR est refuse).
      - name: Le commit appartient a une branche du depot
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          if [ -z "$(git branch -r --contains HEAD)" ]; then
            echo "::error::Le commit $(git rev-parse HEAD) n'est sur aucune branche du depot : refuse."; exit 1
          fi

      - name: Commit construit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # #213 M7 : la provenance signee inscrit le ref et le commit DU WORKFLOW (GITHUB_REF / GITHUB_SHA), pas ceux du
      # checkout. Construire un autre commit (`ref` different du ref de lancement) reste possible pour la qualif, mais
      # l'image n'est alors PAS attestee (avertissement + resume). Image attestee : lancer le workflow SUR la branche a
      # construire, `gh workflow run candidate-images.yml --ref <branche> -f ref=<branche> -f publish=true`.
      - name: Le commit construit est-il celui qui serait atteste
        id: attestable
        env:
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$HEAD_SHA" = "$GITHUB_SHA" ] && [[ "$GITHUB_REF" == refs/heads/* ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "provenance = code construit : ${GITHUB_REF}@${GITHUB_SHA}"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Code construit ${HEAD_SHA} different du workflow ${GITHUB_REF}@${GITHUB_SHA} : image candidate NON attestee (M7)."
            echo "Image candidate NON attestee : commit construit ${HEAD_SHA} != ${GITHUB_REF}@${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: GO
          file: GO/${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/ccoupel/${{ matrix.image }}:sha-${{ steps.commit.outputs.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}

      # #213 : provenance SLSA SIGNEE (Sigstore, jeton OIDC du job) et rangee par GitHub ; les attestations BuildKit ci-dessus
      # (provenance + SBOM) restent attachees a l'image mais ne sont PAS signees. Verification : DOC/project/DEPLOYMENT.md.
      # create-storage-record: false : le storage record exige `artifact-metadata: write` (API d'organisation, non accordee).
      - name: Attestation de provenance signee
        if: steps.attestable.outputs.ok == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/ccoupel/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Reference de promotion QUALIF
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ steps.commit.outputs.sha }}
          IMAGE: ${{ matrix.image }}
        run: |
          echo "ghcr.io/ccoupel/${IMAGE}:sha-${SHA}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
