name: Failover (docker kill)

# Scenario `docker kill` avec les VRAIES peremptions du verrou (~5-6 min). Aucune publication :
# l'image est construite localement depuis le commit. Planifie, manuel, et appelable avant une release.
#
# Le declencheur `schedule` est reste NEUTRALISE (commente) : main contient desormais le code actif/passif
# (v3.0.3 et v3.0.4), donc le cron peut etre reactive (decommenter) sur decision de l'utilisateur.
# Ref teste par defaut : le COMMIT QUI PORTE CE WORKFLOW (github.sha, soit la branche choisie par `--ref`), jamais une autre
# branche : un workflow et un failover-test.sh de commits differents se contredisent (chemins TLS, incident LOT-9 #250).
on:
  # schedule:
  #   - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branche, tag ou commit a tester (vide = le commit du workflow lance ; code construit et script de ce ref)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  failover-kill:
    name: Basculement en conteneurs (docker kill)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - name: Build de l'image du commit
        run: docker build -t secagent-server:ci -f GO/Dockerfile GO
      - name: Racine PRIVATE jetable hors workspace (#250)
        run: |
          mkdir -p "$RUNNER_TEMP/private"
          echo "SECAGENT_PRIVATE_DIR=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Preparation
        env:
          SECAGENT_IMAGE: secagent-server:ci
        run: bash DEPLOYMENT/qualif/failover-test.sh setup-ci
      - name: docker kill du maitre
        env:
          SECAGENT_IMAGE: secagent-server:ci
          QUALIF_TLS_DIR: ${{ runner.temp }}/private/qualif/ci-tls
          KILL_MAX_S: '600'
        run: bash DEPLOYMENT/qualif/failover-test.sh run kill
      - name: "Process fige (SIGSTOP), doit passer unhealthy"
        env:
          SECAGENT_IMAGE: secagent-server:ci
          QUALIF_TLS_DIR: ${{ runner.temp }}/private/qualif/ci-tls
        run: bash DEPLOYMENT/qualif/failover-test.sh run freeze
      - name: Journaux et nettoyage
        if: always()
        env:
          SECAGENT_IMAGE: secagent-server:ci
          QUALIF_TLS_DIR: ${{ runner.temp }}/private/qualif/ci-tls
        run: |
          docker compose -p secagent-qualif -f DEPLOYMENT/qualif/docker-compose.server.yml logs --tail=80 || true
          bash DEPLOYMENT/qualif/failover-test.sh teardown || true
