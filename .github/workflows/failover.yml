name: Failover (docker kill)

# Scenario `docker kill` avec les VRAIES peremptions du verrou (~5-6 min). Aucune publication :
# l'image est construite localement depuis le commit. Planifie, manuel, et appelable avant une release.
#
# ATTENTION : le declencheur `schedule` est NEUTRALISE tant que main ne contient pas le code v3.0.3
# (DEPLOYMENT/qualif/failover-test.sh, GO/Dockerfile actif/passif) : ce workflow est present sur main
# uniquement pour que GitHub expose `workflow_dispatch`, et un cron sur main echouerait chaque nuit.
# A reactiver (decommenter) apres la fusion de milestone/v3.0.3 dans main.
on:
  # schedule:
  #   - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branche, tag ou commit a tester (le code construit et le script sont ceux de ce ref)'
        required: false
        type: string
        default: 'milestone/v3.0.3'

permissions:
  contents: read

jobs:
  failover-kill:
    name: Basculement en conteneurs (docker kill)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || 'milestone/v3.0.3' }}
      - name: Build de l'image du commit
        run: docker build -t secagent-server:ci -f GO/Dockerfile GO
      - name: Preparation
        env:
          SECAGENT_IMAGE: secagent-server:ci
        run: bash DEPLOYMENT/qualif/failover-test.sh setup-ci
      - name: docker kill du maitre
        env:
          SECAGENT_IMAGE: secagent-server:ci
          QUALIF_TLS_DIR: ${{ github.workspace }}/DEPLOYMENT/qualif/.ci-tls
          KILL_MAX_S: '600'
        run: bash DEPLOYMENT/qualif/failover-test.sh run kill
      - name: "Process fige (SIGSTOP), doit passer unhealthy"
        env:
          SECAGENT_IMAGE: secagent-server:ci
          QUALIF_TLS_DIR: ${{ github.workspace }}/DEPLOYMENT/qualif/.ci-tls
        run: bash DEPLOYMENT/qualif/failover-test.sh run freeze
      - name: Journaux et nettoyage
        if: always()
        env:
          SECAGENT_IMAGE: secagent-server:ci
          QUALIF_TLS_DIR: ${{ github.workspace }}/DEPLOYMENT/qualif/.ci-tls
        run: |
          docker compose -p secagent-failover -f DEPLOYMENT/qualif/docker-compose.server.yml logs --tail=80 || true
          bash DEPLOYMENT/qualif/failover-test.sh teardown || true
