name: Failover (docker kill)

# Scenario `docker kill` avec les VRAIES peremptions du verrou (~5-6 min). Aucune publication :
# l'image est construite localement depuis le commit. Planifie, manuel, et appelable avant une release.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  failover-kill:
    name: Basculement en conteneurs (docker kill)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build de l'image du commit
        run: docker build -t secagent-server:ci -f GO/Dockerfile GO
      - name: Preparation
        env:
          SECAGENT_IMAGE: secagent-server:ci
        run: DEPLOYMENT/qualif/failover-test.sh setup-ci
      - name: docker kill du maitre
        env:
          SECAGENT_IMAGE: secagent-server:ci
          QUALIF_TLS_DIR: ${{ github.workspace }}/DEPLOYMENT/qualif/.ci-tls
          KILL_MAX_S: '600'
        run: DEPLOYMENT/qualif/failover-test.sh run kill
      - name: Journaux et nettoyage
        if: always()
        env:
          SECAGENT_IMAGE: secagent-server:ci
          QUALIF_TLS_DIR: ${{ github.workspace }}/DEPLOYMENT/qualif/.ci-tls
        run: |
          docker compose -p secagent-failover -f DEPLOYMENT/qualif/docker-compose.server.yml logs --tail=80 || true
          DEPLOYMENT/qualif/failover-test.sh teardown || true
