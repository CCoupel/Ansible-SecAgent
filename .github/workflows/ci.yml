name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build + tests Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: GO/go.work
          cache-dependency-path: GO/go.sum

      - name: Build
        working-directory: GO
        run: go build ./...

      # Tests bloquants : aucun contournement. Echouent tant que l'issue #100
      # (executor : bytesReader io.EOF, timeout) n'est pas corrigee.
      - name: Tests
        working-directory: GO
        env:
          JWT_SECRET_KEY: test
          ADMIN_TOKEN: test
        run: go test ./... -timeout 120s

  lint:
    name: Lint Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-bloquant (continue-on-error: true) : golangci-lint analyse uniquement
    # le code nouvellement modifié (--new-from-rev=HEAD~1).
    # Dette gofmt existante — voir le log de l'etape gofmt pour la liste des fichiers.
    # Un commit 'gofmt -w .' separe est requis avant d'activer le lint complet.
    # Pour activer le lint complet : retirer continue-on-error et --new-from-rev.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: GO/go.work
          cache-dependency-path: GO/go.sum

      - name: gofmt check
        working-directory: GO
        # L'etape echoue (exit 1) si des fichiers non-conformes sont trouves,
        # ce qui cree une annotation d'erreur visible sur GitHub.
        # continue-on-error au niveau de l'etape permet a golangci-lint de s'executer
        # meme si gofmt echoue. La dette gofmt existante sera traitee dans un commit
        # 'gofmt -w .' separe par dev-relay (voir le log de l'etape pour la liste).
        continue-on-error: true
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Fichiers non conformes a gofmt (dette preexistante — commit 'gofmt -w .' separe requis) :"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "gofmt : aucun fichier non-conforme."

      - name: golangci-lint (nouveaux problemes uniquement)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          working-directory: GO
          args: --new-from-rev=HEAD~1 --timeout=5m

  lint-full:
    name: Lint Go (complet — mesure)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-bloquant : mesure le volume total d'issues existantes pour aider a
    # decider si le lint peut etre rendu bloquant. A retirer ou rendre bloquant
    # apres arbitrage. Le job lint (nouveaux problemes) reste inchange.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: GO/go.work
          cache-dependency-path: GO/go.sum

      - name: golangci-lint (lint complet avec stats par linter)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          working-directory: GO
          # Sans --new-from-rev : analyse tout le code.
          # --show-stats : affiche le nombre d'issues par linter.
          # --max-issues-per-linter=0 et --max-same-issues=0 : illimite (mesure sans plafond).
          # Ces flags CLI overrident max-issues-per-linter/max-same-issues de .golangci.yml,
          # qui restent en place pour le job lint (nouveaux problemes) inchange.
          args: --timeout=10m --show-stats --max-issues-per-linter=0 --max-same-issues=0
