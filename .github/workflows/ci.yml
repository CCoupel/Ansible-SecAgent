name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build + tests Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: GO/go.work
          cache-dependency-path: GO/go.sum

      - name: Build
        working-directory: GO
        run: go build ./...

      # Tests bloquants : aucun contournement. Echouent tant que l'issue #100
      # (executor : bytesReader io.EOF, timeout) n'est pas corrigee.
      - name: Tests
        working-directory: GO
        env:
          JWT_SECRET_KEY: test
          ADMIN_TOKEN: test
        run: go test ./... -timeout 120s

  lint:
    name: Lint Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Bloquant : golangci-lint analyse tout le module (golangci-lint v2.14.0).
    # 0 issue mesuree par qa sur #144 avant activation.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: GO/go.work
          cache-dependency-path: GO/go.sum

      - name: gofmt check
        working-directory: GO
        # L'etape echoue (exit 1) si des fichiers non-conformes sont trouves.
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Fichiers non conformes a gofmt :"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "gofmt : aucun fichier non-conforme."

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          working-directory: GO
          args: --timeout=5m
