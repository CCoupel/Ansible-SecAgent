name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build + tests Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: GO/go.work
          cache-dependency-path: GO/go.sum

      - name: Build
        working-directory: GO
        run: go build ./...

      # Tests bloquants : aucun contournement. -race exige CGO (actif sur ubuntu-latest).
      # -timeout 300s par package : marge x8 sur le package le plus lent (handlers ~37 s en local
      # sous -race), un runner GitHub etant 2 a 3 fois plus lent.
      - name: Tests
        working-directory: GO
        env:
          JWT_SECRET_KEY: test
          ADMIN_TOKEN: test
        run: go test -race ./... -timeout 300s

  lint:
    name: Lint Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Bloquant : golangci-lint analyse tout le module (golangci-lint v2.14.0).
    # 0 issue mesuree par qa sur #144 avant activation.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: GO/go.work
          cache-dependency-path: GO/go.sum

      - name: gofmt check
        working-directory: GO
        # L'etape echoue (exit 1) si des fichiers non-conformes sont trouves.
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Fichiers non conformes a gofmt :"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "gofmt : aucun fichier non-conforme."

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0
          working-directory: GO
          args: --timeout=5m

  ansible-inventory:
    name: Inventaire Ansible
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Bloquant. Valide la sortie reelle du binaire secagent-inventory avec le vrai
    # `ansible-inventory --list` (plugin `script`). ANSIBLE_E2E=1 rend le test OBLIGATOIRE :
    # ansible-inventory introuvable => echec (jamais de skip silencieux). Le job « Build + tests Go »
    # n'installe pas Ansible : les tests TestAnsible* s'y skippent (ANSIBLE_E2E absent).
    # ansible-core est epingle strictement dans .github/ci/requirements-ansible.txt
    # (cle de cache pip) ; Python 3.12 est supporte par ansible-core 2.21 (controleur).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/ci/requirements-ansible.txt

      - name: Installer ansible-core (version epinglee)
        run: |
          python -m pip install -r .github/ci/requirements-ansible.txt
          ansible-inventory --version

      - uses: actions/setup-go@v5
        with:
          go-version-file: GO/go.work
          cache-dependency-path: GO/go.sum

      - name: Tests Go Ansible
        working-directory: GO
        env:
          JWT_SECRET_KEY: test
          ADMIN_TOKEN: test
          ANSIBLE_E2E: '1'
        run: go test -race -run 'Ansible' -v ./cmd/secagent-server/internal/integration/... -timeout 300s
