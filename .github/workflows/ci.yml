name: CI

on:
  push:
    branches: [main, master, 'milestone/**', 'hotfix/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build + tests Go
    runs-on: ubuntu-latest
    # LOT-3.3 (#266, decision Q5 du 2026-11-12) : 15 min (tests -timeout 480s + build + compilation -race)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: GO/go.work
          cache-dependency-path: GO/go.sum

      - name: Build
        working-directory: GO
        run: go build ./...

      # Le serveur est pur Go depuis #160 (plus de SQLite) : la compilation sans CGO doit rester verte.
      - name: Build sans CGO
        working-directory: GO
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      # La version est injectee par -ldflags -X (release.yml, GO/Dockerfile) : ce controle echoue si le chemin du
      # symbole change (renommage du module ou de la variable), sinon la release publierait `dev`.
      - name: Version injectable par ldflags (--version, serveur, minion et inventory)
        working-directory: GO
        run: |
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w -X secagent-server/cmd/secagent-server/internal/cli.Version=9.9.9" -o "$RUNNER_TEMP/secagent-server-v" ./cmd/secagent-server
          bash ../scripts/ci/assert_version.sh 9.9.9 "$RUNNER_TEMP/secagent-server-v"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w -X main.Version=9.9.9" -o "$RUNNER_TEMP/secagent-minion-v" ./cmd/secagent-minion
          COMPONENT=secagent-minion bash ../scripts/ci/assert_version.sh 9.9.9 "$RUNNER_TEMP/secagent-minion-v"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w -X main.Version=9.9.9" -o "$RUNNER_TEMP/secagent-inventory-v" ./cmd/secagent-inventory
          COMPONENT=secagent-inventory bash ../scripts/ci/assert_version.sh 9.9.9 "$RUNNER_TEMP/secagent-inventory-v"

      # Tests bloquants : aucun contournement. -race exige CGO (actif sur ubuntu-latest).
      # -timeout 480s par package (LOT-3.3, #266, decision Q5) : le paquet integration approchait 300 s sur le runner
      # (LOT-3.2 : 84649eb) ; marge sur le package le plus lent sous -race, un runner GitHub etant 2 a 3 fois plus lent.
      - name: Tests
        working-directory: GO
        env:
          JWT_SECRET_KEY: test
          ADMIN_TOKEN: test
        run: go test -race ./... -timeout 480s

  # Tests lents (rafales de 3 000 agents, ~4 min a eux seuls) : exclus de la boucle rapide ci-dessus par
  # le tag de build `slow`, mais JOUES a chaque push dans ce job dedie (le garde-fou n'est pas retire).
  slow-tests:
    name: Tests lents (tag slow, 3 000 agents)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: GO/go.work
          cache-dependency-path: GO/go.sum

      - name: Rafales et charge (-tags slow)
        working-directory: GO
        env:
          JWT_SECRET_KEY: test
          ADMIN_TOKEN: test
        run: |
          # UN `go test` par test lourd, en SEQUENCE : chacun lance des centaines d'enrolements RSA + 3 000 liens TLS ;
          # lances ensemble (t.Parallel) ils se volaient le CPU (runner 4 vCPU) et les clients d'enrolement
          # expiraient (R1 de la QA v3.0.4). Aucun de ces tests n'appelle plus parallel(t).
          go test -race -tags slow -run '^TestBurst_3000EventsAreAllExecutedAndJournaled$' ./cmd/secagent-server/internal/hooks/ -timeout 600s
          go test -race -tags slow -run '^TestHooksBurst_3000AgentsReconnectingAllRunTheirHook$' ./cmd/secagent-server/internal/integration/ -timeout 900s
          # le test de charge compile lui-meme son noeud SANS -race (go test -c) : le RSS d'un noeud -race est sans signification
          go test -race -tags slow -run '^TestTaskLimits_Load3000AgentsNominalThenSaturation$' ./cmd/secagent-server/internal/integration/ -timeout 900s
          go test -race -tags slow -run '^TestExec_AnAnswerLongerThanTheAPIWriteTimeoutArrivesIntact$' ./cmd/secagent-server/internal/integration/ -timeout 300s
          # #217 I6 : 3 000 agents renouvelent leur JWT sans rafale (noeud compile avec -tags testhelpers, sans -race)
          go test -race -tags slow -run '^TestSpec217_I6_Renewal3000AgentsWithoutBurst$' ./cmd/secagent-server/internal/integration/ -timeout 600s
          # binaire reel secagent-server (compile par le test) : state rekey / state restore / keys, contre de vrais noeuds
          go test -race -tags slow -run '^(TestRekeyBinary_|TestKeysCLI_RealBinaryAgainstRealNodes$)' ./cmd/secagent-server/internal/integration/ -timeout 600s
          # LOT-4 v3.0.5 (#233 #219 #220 #221) : binaires reels compiles par les tests (lot4_binary_slow_test.go, tous les TestLot4_*)
          go test -race -tags slow -run '^TestLot4_' ./cmd/secagent-server/internal/integration/ -timeout 600s

  # Tests lents de la QA finale (#223), dans un job SEPARE et PARALLELE de slow-tests : aucune duree ajoutee au chemin
  # critique (le plan limite l'ajout a +20 % ; ces tests en ajouteraient ~+30 a +42 % en sequence).
  slow-qa:
    name: Tests lents QA (tag slow, #223)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: GO/go.work
          cache-dependency-path: GO/go.sum

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/ci/requirements-ansible.txt

      # Le test du plugin (TestQAWriteTimeout_PythonPluginExec17s) lance le VRAI plugin de connexion avec le python3 du PATH :
      # il a besoin d'ansible-core et de httpx (versions epinglees de requirements-ansible.txt, dans un venv jetable du job).
      # Sans eux le test se SAUTE : l'etape de test ci-dessous echoue alors (un saut ne doit jamais passer pour un succes).
      - name: Installer ansible-core et httpx (venv, versions epinglees)
        run: |
          python -m venv "$RUNNER_TEMP/qa-venv"
          "$RUNNER_TEMP/qa-venv/bin/python" -m pip install -r .github/ci/requirements-ansible.txt
          echo "$RUNNER_TEMP/qa-venv/bin" >> "$GITHUB_PATH"

      - name: QA finale (-tags slow)
        working-directory: GO
        env:
          JWT_SECRET_KEY: test
          ADMIN_TOKEN: test
        run: |
          set -euo pipefail
          # En SEQUENCE (chacun lance de vrais noeuds : meme raison que dans slow-tests). Le test plugin attend ~17 s de reponse.
          go test -race -tags slow -run '^TestQAFinal_LinkTrustResetAndRestoreCLI$' ./cmd/secagent-server/internal/integration/ -timeout 300s
          go test -race -tags slow -run '^TestQAIntrusion_' ./cmd/secagent-server/internal/integration/ -timeout 300s
          go test -race -tags slow -v -run '^TestQAWriteTimeout_' ./cmd/secagent-server/internal/integration/ -timeout 300s | tee "$RUNNER_TEMP/plugin17.log"
          if ! grep -q -- '--- PASS: TestQAWriteTimeout_PythonPluginExec17s' "$RUNNER_TEMP/plugin17.log"; then
            echo "::error::TestQAWriteTimeout_PythonPluginExec17s n'a pas ete execute (saute ?) : ansible-core et httpx doivent etre installes"
            exit 1
          fi

  lint:
    name: Lint Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Bloquant : golangci-lint analyse tout le module (golangci-lint v2.14.0).
    # 0 issue mesuree par qa sur #144 avant activation.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: GO/go.work
          cache-dependency-path: GO/go.sum

      - name: gofmt check
        working-directory: GO
        # L'etape echoue (exit 1) si des fichiers non-conformes sont trouves.
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Fichiers non conformes a gofmt :"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "gofmt : aucun fichier non-conforme."

      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.14.0
          working-directory: GO
          args: --timeout=5m

      # #224 : workflows (actionlint) ET scripts de leurs etapes run: (shellcheck, appele par actionlint), puis scripts
      # shell du depot. Binaires epingles, sommes SHA-256 relevees dans les publications amont (fichier de sommes
      # d'actionlint, digest d'asset GitHub pour shellcheck) ; le shellcheck preinstalle du runner n'est jamais utilise.
      - name: actionlint + shellcheck (versions epinglees)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/lint-tools"; mkdir -p "$d/bin"; cd "$d"
          a="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          s="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLo "$a" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$a"
          curl -fsSLo "$s" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$s"
          printf '%s  %s\n%s  %s\n' "$ACTIONLINT_SHA256" "$a" "$SHELLCHECK_SHA256" "$s" | sha256sum -c -
          tar -xzf "$a" -C bin actionlint
          tar -xJf "$s" --strip-components=1 -C bin "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          cd "$GITHUB_WORKSPACE"
          "$d/bin/shellcheck" --version
          "$d/bin/actionlint" -version
          # sans argument : actionlint trouve lui-meme .github/workflows/*.yml ET *.yaml
          "$d/bin/actionlint" -color -shellcheck "$d/bin/shellcheck"
          # scripts livres et de qualif (les autotests *_selftest.sh, au style `chk "..." $(...)`, sont hors perimetre)
          git ls-files -z '*.sh' ':!:*_selftest.sh' | xargs -0 "$d/bin/shellcheck" -S warning

      # LOT-2.2 / M6 : analyse YAML de tous les workflows (*.yml, *.yaml) et actions composites : actions epinglees par
      # SHA 40 hex + `# vX.Y.Z`, images container/services par digest, aucune expression ${{ }} dans run: ni dans le
      # script de github-script. PyYAML n'est pas suppose present sur le runner : venv jetable, version et sommes epinglees.
      - name: Actions epinglees et aucune expression dans les scripts run
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/guard-venv"
          "$RUNNER_TEMP/guard-venv/bin/python" -m pip install --quiet --no-deps --require-hashes --only-binary=:all: -r .github/ci/requirements-guard.txt
          # la garde est elle-meme testee (formes conformes, injections, 14 contournements YAML de M6), AVANT de juger les workflows
          "$RUNNER_TEMP/guard-venv/bin/python" -I scripts/ci/check_actions_pinned_selftest.py
          "$RUNNER_TEMP/guard-venv/bin/python" -I scripts/ci/check_actions_pinned.py
          # T48 (#267) : sources Compose fusionnables par podman-compose 1.5 (aucune ressource nulle surchargee par un dict,
          # memes types des deux cotes) ; garde testee d'abord, puis chaque Compose livre et les combinaisons Podman.
          "$RUNNER_TEMP/guard-venv/bin/python" -I scripts/ci/check_compose_merge_selftest.py
          git ls-files -z 'DEPLOYMENT/*docker-compose*.yml' | xargs -0 "$RUNNER_TEMP/guard-venv/bin/python" -I scripts/ci/check_compose_merge.py --no-null
          # SECAGENT_TMPFS_OPTS=U : valeur posee sous Podman par release.env (stage-node-files.sh) et chain-test.sh
          SECAGENT_TMPFS_OPTS=U "$RUNNER_TEMP/guard-venv/bin/python" -I scripts/ci/check_compose_merge.py -f DEPLOYMENT/qualif/docker-compose.chain.yml -f DEPLOYMENT/qualif/docker-compose.hooks.yml -f DEPLOYMENT/podman/docker-compose.podman.qualif.yml
          "$RUNNER_TEMP/guard-venv/bin/python" -I scripts/ci/check_compose_merge.py -f DEPLOYMENT/prod/docker-compose.server.yml -f DEPLOYMENT/prod/docker-compose.child.yml -f DEPLOYMENT/podman/docker-compose.podman.yml
          # T48 (#267) : rejeu du chemin `chain-test.sh bootstrap` sous Podman avec le VRAI podman-compose des noeuds (1.5.0,
          # version et somme epinglees) et un faux `podman` a etat : un refus de podman-compose (fusion, volume externe,
          # montage) est vu ici, jamais sur srv3/srv4.
          "$RUNNER_TEMP/guard-venv/bin/python" -m pip install --quiet --no-deps --require-hashes --only-binary=:all: -r .github/ci/requirements-podman-compose.txt
          PODMAN_COMPOSE="$RUNNER_TEMP/guard-venv/bin/podman-compose" bash scripts/ci/podman_compose_replay.sh </dev/null

      # LOT-7 / #237 (D17) : en-tete SPDX AGPL-3.0-or-later sur chaque source .go/.py/.sh suivie (exclusions dans la garde).
      # Garde stdlib seule ; elle est elle-meme testee AVANT de juger l'arbre. Correction locale : check_spdx.py --fix.
      - name: En-tetes SPDX
        run: |
          set -euo pipefail
          python3 -I scripts/ci/check_spdx_selftest.py
          python3 -I scripts/ci/check_spdx.py

      # v3.0.5 (D-P3) : VERSION (version_file de project-config.json) = une ligne X.Y.Z ; sur une branche milestone/vX.Y.Z,
      # egal a X.Y.Z. Verification seule (contrat C2) : la CI n'ecrit jamais la version. Egalite au tag : release.yml.
      - name: Fichier VERSION
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/ci/check_version_file_selftest.sh
          case "$REF_NAME" in
            milestone/v*) bash scripts/ci/check_version_file.sh --expect "${REF_NAME#milestone/v}" ;;
            *) bash scripts/ci/check_version_file.sh ;;
          esac

      # LOT-8 / #248 : audit des vulnerabilites (commands.audit) AVANT le milestone, plus seulement a la NR. govulncheck
      # epingle (version + somme h1 du module, verifiee apres installation) ; echec (rc 3) des qu'une vulnerabilite est
      # ATTEINTE par le code (traces d'appel), comme la regle QA « vulnerabilite connue = NOT VALIDATED ».
      - name: govulncheck (vulnerabilites atteintes)
        env:
          GOVULNCHECK_VERSION: v1.9.0
          GOVULNCHECK_H1: h1:12VaqnI9kJfqwRoPptxoqsUhQtdfrSbdksT7X/KY/sc=
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          PATH="$RUNNER_TEMP/bin:$PATH" bash scripts/ci/run_govulncheck.sh

      # LOT-7 / #237 (D15) : THIRD_PARTY_NOTICES.md regenere par go-licenses (version epinglee, module verifie par la base
      # de sommes publique) doit etre identique au fichier commite ; GO/LICENSE et GO/THIRD_PARTY_NOTICES.md (contexte de
      # build des images) identiques aux originaux de la racine.
      - name: Mentions tierces a jour (go-licenses)
        env:
          GO_LICENSES_VERSION: v2.0.1
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/google/go-licenses/v2@${GO_LICENSES_VERSION}"
          PATH="$RUNNER_TEMP/bin:$PATH" bash scripts/ci/gen_third_party_notices.sh --check

  ansible-inventory:
    name: Inventaire Ansible
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Bloquant. Valide la sortie reelle du binaire secagent-inventory avec le vrai
    # `ansible-inventory --list` (plugin `script`). Les tests Ansible sont OPT-IN : ils ne s'executent que si
    # ANSIBLE_E2E=1 (jamais selon la presence d'ansible sur le PATH : le runner « Build + tests Go » a
    # ansible-playbook mais pas httpx et les SKIPPE, ANSIBLE_E2E absent). ANSIBLE_E2E=1 les rend OBLIGATOIRES :
    # outil ou httpx introuvable => echec explicite (jamais de skip silencieux).
    # ansible-core est epingle strictement dans .github/ci/requirements-ansible.txt
    # (cle de cache pip) ; Python 3.12 est supporte par ansible-core 2.21 (controleur).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/ci/requirements-ansible.txt

      # Tout est installe dans un venv jetable du job (jamais dans le Python du systeme) : ansible-core et httpx
      # (requis par le plugin de connexion relay.py) epingles dans requirements-ansible.txt ; ansible-playbook,
      # ansible-inventory et python3 (interpreteur des modules cote cible) viennent de ce venv.
      - name: Installer ansible-core et httpx (venv, versions epinglees)
        run: |
          python -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/python" -m pip install -r .github/ci/requirements-ansible.txt
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ansible-venv/bin/ansible-inventory" --version
          "$RUNNER_TEMP/ansible-venv/bin/ansible-playbook" --version
          "$RUNNER_TEMP/ansible-venv/bin/python" -c "import httpx; print('httpx', httpx.__version__)"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: GO/go.work
          cache-dependency-path: GO/go.sum

      - name: Tests Go Ansible
        working-directory: GO
        env:
          JWT_SECRET_KEY: test
          ADMIN_TOKEN: test
          ANSIBLE_E2E: '1'
        # Convention : test-writer ecrit TestAnsibleInventory_* dans internal/integration, lit ANSIBLE_E2E=1.
        # Garde anti-faux-vert : « no tests to run » et les skips sortent en succes ; on exige donc
        # qu'au moins un test « Ansible » ait reellement PASSE.
        run: |
          set -o pipefail
          go test -race -run 'Ansible' -v ./cmd/secagent-server/internal/integration/... -timeout 600s | tee ansible-test.log
          if ! grep -qE '^--- PASS: .*Ansible' ansible-test.log; then
            echo "::error::Aucun test Ansible execute et passe (absent ou skippe) : le job ne valide rien."
            exit 1
          fi
          # Aucun skip silencieux : ANSIBLE_E2E=1 rend tout test Ansible obligatoire.
          if grep -qE '^\s*--- SKIP: .*Ansible' ansible-test.log; then
            echo "::error::Un test Ansible a ete SKIPPE (ANSIBLE_E2E=1 interdit les skips)."
            grep -E '^\s*--- SKIP: .*Ansible' ansible-test.log
            exit 1
          fi
          # #171 D : chacun des scenarios async/poll doit avoir reellement PASSE (noms exacts des tests).
          for t in TestAnsibleAsync_D1_ TestAnsibleAsync_D2_ TestAnsibleAsync_D3_JobSurvives TestAnsibleAsync_D3_PollInFlight TestAnsibleAsync_D4_; do
            if ! grep -qE "^--- PASS: ${t}" ansible-test.log; then
              echo "::error::Test ${t}* absent ou non passe (#171 D) : le job ne prouve pas l'async/poll."
              exit 1
            fi
          done

  # ---- Conteneurs et Compose (#174 M4/M5) ---------------------------------------------------------
  docker-compose-checks:
    name: Dockerfiles + Compose (rendu, port admin, anti-NATS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Bloquant : un Dockerfile casse est detecte au push, pas au tag.
      - name: Build serveur (sans push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: GO
          file: GO/Dockerfile
          push: false
          cache-from: type=gha,scope=secagent-server
      - name: Build minion (sans push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: GO
          file: GO/Dockerfile.agent
          push: false
          cache-from: type=gha,scope=secagent-minion

      # Un push ne fait QUE des tests : ni login registre, ni push d'image, ni packages: write dans ce fichier.
      - name: Garde-fou - aucune publication dans ci.yml
        run: python3 scripts/ci/check_no_publish.py .github/workflows/ci.yml

      - name: Autotest du controle de rendu
        run: |
          python3 scripts/ci/check_compose_selftest.py
          python3 scripts/ci/test_shared_storage_hosts.py
          python3 scripts/ci/check_no_publish_selftest.py
          python3 scripts/ci/check_scripts_selftest.py
          bash scripts/ci/chain_verify_images_selftest.sh
          bash scripts/ci/failover_guard_selftest.sh
          python3 scripts/ci/check_no_binds_selftest.py
          python3 -I scripts/ci/check_podman_certs_selftest.py
          bash scripts/ci/admission_503_selftest.sh
          bash scripts/ci/ansible_version_selftest.sh
          python3 -I DEPLOYMENT/qualif/tools/test_ghcr_image_archive.py
          bash scripts/ci/assert_version_selftest.sh
          bash scripts/ci/release_notes_selftest.sh
          bash scripts/ci/makefile_selftest.sh
          bash scripts/ci/build_compose_archive_selftest.sh
          bash scripts/ci/minion_entrypoint_selftest.sh
          bash scripts/ci/preflight_secrets_selftest.sh
          bash scripts/ci/private_paths_selftest.sh
          bash scripts/ci/qualif_pki_selftest.sh
          bash scripts/ci/install_node_selftest.sh
          bash scripts/ci/podman_cli_selftest.sh
          bash scripts/ci/podman_node_files_selftest.sh
          bash scripts/ci/reset_state_selftest.sh
          bash scripts/ci/state_backup_selftest.sh
          python3 scripts/ci/check_scripts.py .github/workflows/*.yml

      # Variables d'exemple NON secretes : uniquement pour que `docker compose config` puisse interpoler.
      - name: Rendu et controles de chaque Compose prod et qualif
        env:
          SECAGENT_VERSION: v0.0.0
          STATE_HOST_DIR: /mnt/state
          TLS_CERT_DIR: /etc/tls
          QUALIF_TLS_DIR: /etc/tls
          SECAGENT_IMAGE: ghcr.io/ccoupel/secagent-server:sha-0000000
          SECAGENT_MINION_IMAGE: ghcr.io/ccoupel/secagent-minion:sha-0000000
          REPEATER_ID: ci
          REPEATER_UPSTREAM_URL: wss://parent.example:7772
          REPEATER_ROOT_ID: root
          ROOT_LINK_KEY_FILE: /etc/tls/root-link.pub
        run: |
          set -euo pipefail
          mkdir -p render
          touch DEPLOYMENT/prod/prod.env   # fichier vide : valeur jamais lue (qualif : plus de qualif.env depuis v3.0.5, secrets en volume)
          # Prod : un fichier par role (racine, racine + enfant)
          docker compose -f DEPLOYMENT/prod/docker-compose.server.yml config --format json > render/prod-root.json
          docker compose -f DEPLOYMENT/prod/docker-compose.server.yml -f DEPLOYMENT/prod/docker-compose.child.yml config --format json > render/prod-child.json
          # v3.0.5 : ports d'hote PROD parametrables (hote partage avec la QUALIF : 17770/17772/17771) ; ports conteneur inchanges
          API_PUBLISH_PORT=17770 WS_PUBLISH_PORT=17772 ADMIN_PUBLISH_PORT=17771 \
            docker compose -f DEPLOYMENT/prod/docker-compose.server.yml config --format json > render/prod-root-ports.json
          python3 - <<'PY'
          import json, sys
          def ports(f):
              svc = json.load(open(f))["services"]["secagent-server"]
              return sorted((int(p["target"]), str(p.get("published")), p.get("host_ip") or "") for p in svc.get("ports") or [])
          want = {"render/prod-root.json": [(7770, "7770", ""), (7771, "7771", "127.0.0.1"), (7772, "7772", "")],
                  "render/prod-root-ports.json": [(7770, "17770", ""), (7771, "17771", "127.0.0.1"), (7772, "17772", "")]}
          for f, w in want.items():
              if ports(f) != w:
                  sys.exit(f"::error::{f} : ports publies {ports(f)} != {w}")
          print("ports PROD : defauts 7770/7771/7772 et parametrage 17770/17771/17772 rendus comme attendu")
          PY
          docker compose -f DEPLOYMENT/qualif/docker-compose.server.yml config --format json > render/qualif-server.json
          # chain-test.sh ajoute TOUJOURS docker-compose.hooks.yml (hooks.json par volume nomme)
          docker compose -f DEPLOYMENT/qualif/docker-compose.chain.yml -f DEPLOYMENT/qualif/docker-compose.hooks.yml config --format json > render/qualif-chain.json
          docker compose -f DEPLOYMENT/qualif/docker-compose.chain.yml -f DEPLOYMENT/qualif/docker-compose.remote-tls.yml -f DEPLOYMENT/qualif/docker-compose.hooks.yml config --format json > render/qualif-chain-remote.json
          # Profil `negative` (minion-negca) : absent du rendu par defaut, donc de tout controle sans --profile
          docker compose --profile negative -f DEPLOYMENT/qualif/docker-compose.chain.yml -f DEPLOYMENT/qualif/docker-compose.hooks.yml config --format json > render/qualif-chain-negative.json
          # 3e niveau (profil level3, LOT-3.2 : secagent-grandchild dmz2 + minion-grand) : rendu et controles du durcissement
          docker compose --profile level3 -f DEPLOYMENT/qualif/docker-compose.chain.yml -f DEPLOYMENT/qualif/docker-compose.remote-tls.yml -f DEPLOYMENT/qualif/docker-compose.hooks.yml config --format json > render/qualif-chain-level3-remote.json
          python3 - <<'PY'
          import json, sys
          svc = json.load(open("render/qualif-chain-level3-remote.json"))["services"]
          if not {"secagent-grandchild", "minion-grand"} <= set(svc):
              sys.exit("::error::secagent-grandchild/minion-grand absents du rendu --profile level3")
          if "minion-negca" not in json.load(open("render/qualif-chain-negative.json"))["services"]:
              sys.exit("::error::minion-negca absent du rendu --profile negative : le controle de durcissement ne le verrait pas")
          PY
          python3 scripts/ci/check_compose.py --require-memory-limit --require-secret-files render/prod-root.json render/prod-root-ports.json render/prod-child.json render/qualif-server.json render/qualif-chain.json render/qualif-chain-remote.json render/qualif-chain-negative.json render/qualif-chain-level3-remote.json
          # Podman rootless (#267, LOT-4) : surcharges keep-id rendues sur les Compose livres ; uid 10001 du conteneur =
          # utilisateur rootless de l'hote. Rendu par docker compose (userns_mode est une cle Compose standard).
          docker compose -f DEPLOYMENT/prod/docker-compose.server.yml -f DEPLOYMENT/podman/docker-compose.podman.yml config --format json > render/podman-prod-root.json
          docker compose -f DEPLOYMENT/prod/docker-compose.server.yml -f DEPLOYMENT/prod/docker-compose.child.yml -f DEPLOYMENT/podman/docker-compose.podman.yml config --format json > render/podman-prod-child.json
          # Chaine QUALIF repartie (srv3/srv4) : chemins du partage tels que vus par les noeuds (rien n'est lu ici)
          PQ=/share/MFS/ROOT/CLAUDE_PROJETS/PROJETS/PRO/Ansible_SecAgent/PRIVATE/QUALIF
          QUALIF_PRIVATE_DIR="$PQ" QUALIF_TLS_DIR="$PQ/pki" QUALIF_NODE_A_ADDR=192.168.1.213 SECAGENT_TMPFS_OPTS=U \
            docker compose -f DEPLOYMENT/qualif/docker-compose.chain.yml -f DEPLOYMENT/qualif/docker-compose.hooks.yml -f DEPLOYMENT/podman/docker-compose.podman.qualif.yml config --format json > render/podman-qualif-chain.json
          python3 scripts/ci/check_compose.py --require-memory-limit --require-secret-files --require-userns-keepid render/podman-prod-root.json render/podman-prod-child.json render/podman-qualif-chain.json
          # Hypotheses de la garde check-private.sh (QUALIF pki/ en 0711, tls.key 0600) : seuls les SERVEURS sont en keep-id
          # (uid 10001 = proprietaire : lisent tls.key) ; les MINIONS restent sans keep-id (uid `relay` != proprietaire : ne
          # lisent que les certificats publics) et montent /certs en lecture seule.
          python3 scripts/ci/check_podman_certs.py render/podman-qualif-chain.json
          # Binds (y compris les volumes driver_opts) limites aux sous-chemins permis de PRIVATE/QUALIF ; jamais ca.key ni poste-cyril
          python3 scripts/ci/check_no_binds.py --allow-prefix "$PQ" < render/podman-qualif-chain.json
          # Rendu destine a un demon Docker DISTANT (qualif reelle) : aucun chemin du client (bind, secret/config file:, build).
          # Le CI a un demon local et ne peut pas voir ce defaut a l'execution : ce controle statique est la seule garde.
          python3 scripts/ci/check_no_binds.py < render/qualif-chain-remote.json
          python3 scripts/ci/check_no_binds.py < render/qualif-chain-level3-remote.json

      - name: Test negatif — un Compose qui publie 7771 sur toutes les interfaces doit echouer
        run: |
          docker compose -f scripts/ci/testdata/bad-admin-port.yml config --format json > render/bad.json
          if python3 scripts/ci/check_compose.py render/bad.json; then
            echo "::error::Le controle du port admin a laisse passer un Compose non conforme"; exit 1
          fi
          docker compose -f scripts/ci/testdata/good.yml config --format json > render/good.json
          python3 scripts/ci/check_compose.py render/good.json

      # NATS est retire du projet (#178) : aucune dependance, aucun service, aucune variable.
      - name: Garde anti-NATS
        run: |
          set -u
          fail=0
          if grep -rniE 'nats|jetstream' DEPLOYMENT/prod DEPLOYMENT/qualif/docker-compose.server.yml; then fail=1; fi
          if grep -rniE 'RELAY_INSECURE_TLS|DATABASE_URL|caddy|^[[:space:]]*build:' --include='*.yml' DEPLOYMENT; then fail=1; fi
          if grep -rniE 'nats|jetstream' DEPLOYMENT/qualif --include='*.yml' --include='*.sh'; then fail=1; fi
          if grep -niE 'nats|jetstream' GO/go.mod GO/go.sum; then fail=1; fi
          if grep -rniE 'nats-io|nats\.go|jetstream' GO --include='*.go' --exclude='*_test.go'; then fail=1; fi
          if [ "$fail" -ne 0 ]; then echo "::error::Reference a NATS reintroduite (#178)"; exit 1; fi

  # ---- Basculement actif/passif en conteneurs (#174 M6) : arret propre, rapide, bloquant -------------
  # Image construite LOCALEMENT depuis le commit (aucun login, aucun push). Le scenario `docker kill`
  # (peremption reelle du verrou, ~5-6 min) est dans failover.yml (planifie, manuel et avant release).
  failover-stop:
    name: Basculement en conteneurs (arret propre)
    needs: [docker-compose-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build de l'image du commit
        run: docker build -t secagent-server:ci -f GO/Dockerfile GO
      - name: Racine PRIVATE jetable hors workspace (#250)
        run: |
          mkdir -p "$RUNNER_TEMP/private"
          echo "SECAGENT_PRIVATE_DIR=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: Preparation (certificats et secrets JETABLES, etat initial)
        env:
          SECAGENT_IMAGE: secagent-server:ci
        run: bash DEPLOYMENT/qualif/failover-test.sh setup-ci
      - name: Arret propre du maitre
        env:
          SECAGENT_IMAGE: secagent-server:ci
          QUALIF_TLS_DIR: ${{ runner.temp }}/private/QUALIF/ci-tls
        run: bash DEPLOYMENT/qualif/failover-test.sh run stop
      - name: Journaux et nettoyage
        if: always()
        env:
          SECAGENT_IMAGE: secagent-server:ci
          QUALIF_TLS_DIR: ${{ runner.temp }}/private/QUALIF/ci-tls
        run: |
          docker compose -p secagent-qualif -f DEPLOYMENT/qualif/docker-compose.server.yml logs --tail=80 || true
          bash DEPLOYMENT/qualif/failover-test.sh teardown || true

  # ---- Chaine de relais en conteneurs (#188), sur chaque push : racine A/P + enfant pull + 2 minions ----------
  # Image serveur et minion construites LOCALEMENT depuis le commit (aucun login, aucun push). Uniquement
  # l'arret propre (le `kill` de 5-6 min est dans failover.yml).
  chain-containers:
    name: Chaine en conteneurs (amorcage, smoke, bascule)
    needs: [docker-compose-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SECAGENT_IMAGE: secagent-server:ci
      SECAGENT_MINION_IMAGE: secagent-minion:ci
      INVENTORY_BIN: ${{ github.workspace }}/GO/secagent-inventory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: GO/go.work
          cache-dependency-path: GO/go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/ci/requirements-ansible.txt
      - name: Poste de controle Ansible (venv, ansible-core + httpx epingles, secagent-inventory)
        run: |
          python -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/python" -m pip install -r .github/ci/requirements-ansible.txt
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"
          cd GO && CGO_ENABLED=0 go build -trimpath -o secagent-inventory ./cmd/secagent-inventory
      - name: Images serveur et minion du commit (locales, sans push)
        run: |
          docker build -t secagent-server:ci -f GO/Dockerfile GO
          docker build -t secagent-minion:ci -f GO/Dockerfile.agent GO
      - name: Racine PRIVATE jetable hors workspace (#250)
        run: |
          mkdir -p "$RUNNER_TEMP/private"
          echo "SECAGENT_PRIVATE_DIR=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: PKI de test et secrets jetables
        run: bash DEPLOYMENT/qualif/chain-test.sh ci-prepare
      - name: Amorcage de la chaine
        run: bash DEPLOYMENT/qualif/chain-test.sh bootstrap
      - name: Smoke (relais, minions, inventaire, ansible ping)
        run: bash DEPLOYMENT/qualif/chain-test.sh smoke
      - name: Bascule de la racine (arret propre) puis smoke
        run: bash DEPLOYMENT/qualif/chain-test.sh failover
      - name: Journaux et nettoyage
        if: always()
        run: |
          bash DEPLOYMENT/qualif/chain-test.sh logs || true
          bash DEPLOYMENT/qualif/chain-test.sh down || true

  # ---- Repetition a vide de la release (#174 L3) : AUCUNE publication, digest factice -------------------------
  release-dryrun:
    name: Repetition a vide de l'archive Compose
    needs: [docker-compose-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive avec digest factice (meme script que release.yml)
        run: |
          set -euo pipefail
          FAKE="sha256:$(printf '0%.0s' $(seq 64))"
          bash scripts/ci/build_compose_archive.sh v0.0.0 0.0.0 "$FAKE" dist
          bash scripts/ci/build_compose_archive.sh v0.0.0 0.0.0 "$FAKE" dist2   # reproductibilite de l'archive
          cmp dist/secagent-compose-0.0.0.tar.gz dist2/secagent-compose-0.0.0.tar.gz
          (cd dist && sha256sum ./* > SHA256SUMS-0.0.0.txt && sha256sum -c SHA256SUMS-0.0.0.txt)
      - name: Le contenu de l'archive est valide (rendu Compose et controles)
        env:
          STATE_HOST_DIR: /mnt/state
          TLS_CERT_DIR: /etc/tls
          REPEATER_ID: ci
          REPEATER_UPSTREAM_URL: wss://parent.example:7772
          REPEATER_ROOT_ID: root
          ROOT_LINK_KEY_FILE: /etc/tls/root-link.pub
        run: |
          set -euo pipefail
          mkdir x && tar -xzf dist/secagent-compose-0.0.0.tar.gz -C x
          cd x/secagent-compose-0.0.0
          touch prod.env
          test -x preflight-secrets.sh   # documente comme `./preflight-secrets.sh` : doit rester executable dans l'archive
          grep -E 'image: ghcr.io/ccoupel/secagent-server:v0.0.0@sha256:[0-9a-f]{64}$' docker-compose.server.yml
          docker compose --env-file .env.example -f docker-compose.server.yml config --format json > r.json
          docker compose --env-file .env.example -f docker-compose.server.yml -f docker-compose.child.yml config --format json > c.json
          python3 tools/check_compose.py --require-memory-limit --require-digest --require-secret-files r.json c.json
          # surcharge Podman rootless de PROD (#267) embarquee dans l'archive (stage-node-files.sh prod la lit par son nom)
          docker compose --env-file .env.example -f docker-compose.server.yml -f docker-compose.podman.yml config --format json > p.json
          python3 tools/check_compose.py --require-memory-limit --require-digest --require-secret-files --require-userns-keepid p.json
      - name: Tests negatifs - l'archive est refusee avec latest ou NATS
        run: |
          set -u
          FAKE="sha256:$(printf '0%.0s' $(seq 64))"
          cp -r DEPLOYMENT/prod bad-latest && printf 'x-bad:\n  image: nginx:latest\n' >> bad-latest/docker-compose.server.yml
          if STAGE_DIR=s1 SRC_DIR=bad-latest bash scripts/ci/build_compose_archive.sh v0.0.0 0.0.0 "$FAKE" o1; then echo "::error::latest accepte"; exit 1; fi
          cp -r DEPLOYMENT/prod bad-nats && printf '# nats\n' >> bad-nats/docker-compose.server.yml
          if STAGE_DIR=s2 SRC_DIR=bad-nats bash scripts/ci/build_compose_archive.sh v0.0.0 0.0.0 "$FAKE" o2; then echo "::error::NATS accepte"; exit 1; fi
          if bash scripts/ci/build_compose_archive.sh v0.0.0 0.0.0 sha256:abc o3; then echo "::error::digest invalide accepte"; exit 1; fi
          echo "refus attendus : OK"

  # ---- Reproductibilite des images (#174 M1) : 2 builds locaux du meme commit, comparaison des digests --------
  # Informatif : un ecart est un ::warning:: documente (cause probable : `apk` du minion), pas un echec.
  reproducibility:
    name: Reproductibilite ${{ matrix.image }}
    needs: [docker-compose-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: secagent-server, dockerfile: Dockerfile}
          - {image: secagent-minion, dockerfile: Dockerfile.agent}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Deux builds, comparaison des digests (aucun push)
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          for n in 1 2; do
            docker buildx build --provenance=false --sbom=false --no-cache \
              --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
              -f "GO/${DOCKERFILE}" \
              --output "type=oci,dest=build$n.tar,rewrite-timestamp=true" GO
            mkdir "o$n" && tar -xf "build$n.tar" -C "o$n"
            python3 -c "import json;print(json.load(open('o$n/index.json'))['manifests'][0]['digest'])" > "d$n"
          done
          echo "build1=$(cat d1) build2=$(cat d2)" | tee -a "$GITHUB_STEP_SUMMARY"
          if cmp -s d1 d2; then
            echo "Reproductible : meme digest." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::${IMAGE} : builds NON reproductibles ($(cat d1) != $(cat d2)). A documenter (cause) avant de passer en erreur."
            for n in 1 2; do echo "couches build$n :"; python3 scripts/ci/oci_layers.py "o$n"; done
          fi

  # ---- Sauvegarde / restauration de l'etat et de RSA_MASTER_KEY en conteneurs (#170 L4) ----------------------
  backup-restore-containers:
    name: Sauvegarde et restauration (etat + RSA_MASTER_KEY)
    needs: [docker-compose-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SECAGENT_IMAGE: secagent-server:ci
      SECAGENT_MINION_IMAGE: secagent-minion:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Images serveur et minion du commit (locales, sans push)
        run: |
          docker build -t secagent-server:ci -f GO/Dockerfile GO
          docker build -t secagent-minion:ci -f GO/Dockerfile.agent GO
      - name: Racine PRIVATE jetable hors workspace (#250)
        run: |
          mkdir -p "$RUNNER_TEMP/private"
          echo "SECAGENT_PRIVATE_DIR=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
      - name: PKI de test, secrets jetables, amorcage
        run: |
          bash DEPLOYMENT/qualif/chain-test.sh ci-prepare
          bash DEPLOYMENT/qualif/chain-test.sh bootstrap
      - name: Sinistre et restauration
        run: bash DEPLOYMENT/qualif/chain-test.sh backup-restore
      - name: Journaux et nettoyage
        if: always()
        run: |
          bash DEPLOYMENT/qualif/chain-test.sh logs || true
          bash DEPLOYMENT/qualif/chain-test.sh down || true

  # ---- Artefact d'images pour la qualif distante (sans registre) : docker save + docker load ----------------
  # Les images du commit sont construites (memes Dockerfiles, flags deterministes), exportees par `docker save` et
  # televersees comme ARTEFACT du run (7 jours), avec le binaire secagent-inventory du poste de controle Ansible.
  # AUCUN login registre, AUCUN push, aucune permission packages: write. Sur l'hote : `chain-test.sh load-images`.
  images-artifact:
    name: Artefact d'images (docker save) et secagent-inventory
    if: github.event_name == 'push'
    needs: [docker-compose-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: GO/go.work
          cache-dependency-path: GO/go.sum
      - name: Construire, exporter, empreintes
        run: |
          set -euo pipefail
          SHA12="${GITHUB_SHA::12}"
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          export SOURCE_DATE_EPOCH
          mkdir -p out
          docker build --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" -t "secagent-server:ci-${SHA12}" -f GO/Dockerfile GO
          docker build --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" -t "secagent-minion:ci-${SHA12}" -f GO/Dockerfile.agent GO
          docker save "secagent-server:ci-${SHA12}" | gzip -n > "out/secagent-server-ci-${SHA12}.tar.gz"
          docker save "secagent-minion:ci-${SHA12}" | gzip -n > "out/secagent-minion-ci-${SHA12}.tar.gz"
          (cd GO && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags="-s -w" -o ../out/secagent-inventory ./cmd/secagent-inventory)
          {
            echo "SECAGENT_IMAGE=secagent-server:ci-${SHA12}"
            echo "SECAGENT_MINION_IMAGE=secagent-minion:ci-${SHA12}"
            echo "SECAGENT_PULL_POLICY=never"
          } > out/images.env
          # Empreintes STABLES des images (sha256 des couches RootFS.Layers ; l'ID varie selon le magasin containerd) :
          # non secrets, verifiees par `chain-test.sh load-images` puis avant chaque demarrage (meme calcul que image_fp).
          fp() { docker image inspect --format '{{json .RootFS.Layers}}' "$1" | sha256sum | cut -d' ' -f1; }
          {
            echo "secagent-server:ci-${SHA12} $(fp "secagent-server:ci-${SHA12}")"
            echo "secagent-minion:ci-${SHA12} $(fp "secagent-minion:ci-${SHA12}")"
          } > out/images.ids
          (cd out && sha256sum ./* > SHA256SUMS && cat SHA256SUMS)
          {
            echo "empreinte couches serveur : $(fp "secagent-server:ci-${SHA12}")"
            echo "empreinte couches minion  : $(fp "secagent-minion:ci-${SHA12}")"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          chmod +x out/secagent-inventory
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secagent-images-${{ github.sha }}
          path: out/
          retention-days: 7
          if-no-files-found: error
