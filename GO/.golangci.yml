# .golangci.yml — Configuration golangci-lint v2 pour GO/
#
# En CI : golangci-lint v2.14.0 via golangci-lint-action@v7, lint complet bloquant.
# 0 issue mesurée par qa sur #144 avant activation (max-issues-per-linter: 0, plafonds désactivés).
#
# Lint local :
#   cd GO && golangci-lint run   # lint complet

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
  exclusions:
    rules:
      # errcheck moins strict sur les fichiers de test
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
