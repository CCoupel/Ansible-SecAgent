version: '3.9'

services:
  # Relay API server (GO)
  relay-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relay-api
    ports:
      - "7770:7770"  # API endpoints
      - "7771:7771"  # Admin endpoints
      - "7772:7772"  # WebSocket agent connections
    user: "0:0"   # root pour qualif — volume /data owned by root
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - DATABASE_URL=/data/relay.db
      - LOG_LEVEL=INFO
    volumes:
      - relay-db:/data
    healthcheck:
      test: ["CMD", "/app/secagent-server", "status", "--local"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - relay-network
    restart: unless-stopped

  # TLS termination proxy (Caddy)
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: relay-caddy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - ACME_AGREE=true
    networks:
      - relay-network
    depends_on:
      relay-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  relay-db:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  relay-network:
    driver: bridge
